## Name the Opal C1's microphone "Opal C1 Microphone".
##
## PipeWire takes a USB device's description from the system's hardware
## database when it has an entry. The camera's stored firmware has none, so
## its microphone is listed as "Opal C1". Run from RAM under opal-controller
## the same firmware enumerates under a generic product id that the database
## calls "Myriad VPU [Movidius Neural Compute Stick]", and that is the name
## applications would show. This rule gives it one name in both cases.
##
## Install to ~/.config/wireplumber/wireplumber.conf.d/ and restart
## WirePlumber (or log in again).

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Opal_Opal_C1.*"
      }
    ]
    actions = {
      update-props = {
        node.description = "Opal C1 Microphone"
      }
    }
  }
]
