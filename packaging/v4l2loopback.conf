# decomposer's two virtual cameras.
#
# exclusive_caps=1 makes the node advertise capture capability only once a
# producer is attached, which is what Chrome, Zoom, Discord and OBS expect —
# without it they tend to list the device and then fail to open it.
#
# /dev/video10 follows the SEND flip controls. /dev/video11 always removes
# those flips, so apps such as Meet can be excluded simply by selecting the
# normal camera once. card_label is what users see in a camera picker.
#
# Install:
#   sudo install -m 0644 packaging/v4l2loopback.conf /etc/modprobe.d/
#   sudo install -m 0644 packaging/v4l2loopback-load.conf /etc/modules-load.d/
#   sudo modprobe v4l2loopback
options v4l2loopback devices=2 video_nr=10,11 card_label="decomposer Send Flip,decomposer Normal" exclusive_caps=1,1 max_buffers=2
