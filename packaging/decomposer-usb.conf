# decomposer: disable USB3 link power management for the Opal C1's Opal
# personality (03e7:f63d). Myriad X devices are documented to misbehave under
# U1/U2 transitions; the quirk is harmless when not needed.
# Install: sudo cp packaging/decomposer-usb.conf /etc/tmpfiles.d/
w /sys/module/usbcore/parameters/quirks - - - - 03e7:f63d:k
