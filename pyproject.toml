[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decomposer"
version = "1.1.0"
description = "Composer-inspired looks for the Opal C1 on Linux (and later Windows)"
readme = "README.md"
requires-python = ">=3.9"
# depthai drives the camera in Studio mode and brings numpy with it. pyusb is
# only needed for the read-only XLink and extension-unit diagnostics. Nothing
# here touches frames: the Rust engine in engine/ owns the pixel path.
dependencies = [
  "numpy>=1.24",
  "depthai>=3.0",
  "pyusb>=1.2",
]

[project.optional-dependencies]
gui = ["pygobject>=3.46"]
# Tooling for the reference-capture workflow, not the runtime. OpenCV is
# used by check_reference.py to find the target's fiducials and de-warp a
# photographed chart; nothing in the frame path needs it.
references = ["opencv-python>=4.8"]
dev = ["pytest>=7.0"]

[project.scripts]
decomposer = "opal_c1.cli:main"

[project.gui-scripts]
decomposer-panel = "opal_c1.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
